<section style="max-width: 1460px; margin: 0 auto; padding: 32px; color: #f4f4f4; font-family: Arial, sans-serif;">
  <header style="margin-bottom: 24px;">
    <p style="margin: 0 0 8px; color: #67d5ed; font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;">Run Pro Business · Publicidade</p>
    <h1 style="margin: 0 0 10px; font-size: 32px;">Escolha a direção do novo formulário</h1>
    <p style="margin: 0; color: #b9b9b9; line-height: 1.5;">As três opções mantêm os quatro passos, anúncios apenas de eventos vinculados e valores sugeridos de CPC em R$ 0,56, R$ 0,94 e R$ 1,32.</p>
  </header>

  <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(390px, 1fr)); gap: 22px; align-items: start;">
    <button type="button" data-choice="1" onclick="document.querySelectorAll('[data-choice]').forEach(e=>e.style.outline='none'); this.style.outline='3px solid #60c9e5';" style="padding: 0; overflow: hidden; text-align: left; cursor: pointer; border: 1px solid #555; border-radius: 8px; background: #2d2d2d; color: inherit;">
      <img src="assets/opcao-1.png" alt="Opção 1 do formulário de campanha" style="display:block; width:100%; height:auto;">
      <span style="display:block; padding:16px 18px; font-size:18px; font-weight:800;">Opção 1</span>
    </button>

    <button type="button" data-choice="2" onclick="document.querySelectorAll('[data-choice]').forEach(e=>e.style.outline='none'); this.style.outline='3px solid #60c9e5';" style="padding: 0; overflow: hidden; text-align: left; cursor: pointer; border: 1px solid #555; border-radius: 8px; background: #2d2d2d; color: inherit;">
      <img src="assets/opcao-2.png" alt="Opção 2 do formulário de campanha" style="display:block; width:100%; height:auto;">
      <span style="display:block; padding:16px 18px; font-size:18px; font-weight:800;">Opção 2</span>
    </button>

    <button type="button" data-choice="3" onclick="document.querySelectorAll('[data-choice]').forEach(e=>e.style.outline='none'); this.style.outline='3px solid #60c9e5';" style="padding: 0; overflow: hidden; text-align: left; cursor: pointer; border: 1px solid #555; border-radius: 8px; background: #2d2d2d; color: inherit;">
      <img src="assets/opcao-3.png" alt="Opção 3 do formulário de campanha" style="display:block; width:100%; height:auto;">
      <span style="display:block; padding:16px 18px; font-size:18px; font-weight:800;">Opção 3</span>
    </button>
  </div>
</section>
