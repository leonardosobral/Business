# Install only after verifying DNS and issuing the domain certificate.
<VirtualHost *:80>
 ServerName ads.roadrunners.run
 DocumentRoot /var/www/ads.roadrunners.run
 Alias /.well-known/acme-challenge/ /var/www/ads.roadrunners.run/.well-known/acme-challenge/
 <Directory /var/www/ads.roadrunners.run>
  Options -Indexes +FollowSymLinks -MultiViews
  AllowOverride None
  Require all granted
 </Directory>
 RewriteEngine On
 RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
 RewriteRule ^ https://ads.roadrunners.run%{REQUEST_URI} [R=301,END,NE]
</VirtualHost>
<IfModule mod_ssl.c>
<VirtualHost *:443>
 ServerName ads.roadrunners.run
 DocumentRoot /var/www/ads.roadrunners.run
 ErrorLog ${APACHE_LOG_DIR}/ads.roadrunners.run-error.log
 # Match the trusted Cloudflare proxy list used by the existing API vhost.
 RemoteIPHeader CF-Connecting-IP
 RemoteIPTrustedProxy 173.245.48.0/20
 RemoteIPTrustedProxy 103.21.244.0/22
 RemoteIPTrustedProxy 103.22.200.0/22
 RemoteIPTrustedProxy 103.31.4.0/22
 RemoteIPTrustedProxy 141.101.64.0/18
 RemoteIPTrustedProxy 108.162.192.0/18
 RemoteIPTrustedProxy 190.93.240.0/20
 RemoteIPTrustedProxy 188.114.96.0/20
 RemoteIPTrustedProxy 197.234.240.0/22
 RemoteIPTrustedProxy 198.41.128.0/17
 RemoteIPTrustedProxy 162.158.0.0/15
 RemoteIPTrustedProxy 104.16.0.0/13
 RemoteIPTrustedProxy 104.24.0.0/14
 RemoteIPTrustedProxy 172.64.0.0/13
 RemoteIPTrustedProxy 131.0.72.0/22
 RemoteIPTrustedProxy 2400:cb00::/32
 RemoteIPTrustedProxy 2606:4700::/32
 RemoteIPTrustedProxy 2803:f800::/32
 RemoteIPTrustedProxy 2405:b500::/32
 RemoteIPTrustedProxy 2405:8100::/32
 RemoteIPTrustedProxy 2a06:98c0::/29
 RemoteIPTrustedProxy 2c0f:f248::/32
 # No query strings, tokens or cookies in access logs.
 LogFormat "%a %t %m %U %>s %B %D" rr_ads_network
 CustomLog ${APACHE_LOG_DIR}/ads.roadrunners.run-access.log rr_ads_network
 <Directory /var/www/ads.roadrunners.run>
  Options -Indexes +FollowSymLinks -MultiViews
  AllowOverride None
  Require all granted
  LimitRequestBody 8192
 </Directory>
 RewriteEngine On
 RewriteRule ^/?sdk/v1\.js$ - [END]
 RewriteRule ^/?v1/(serve|viewable|click)\.cfm$ - [END]
 RewriteRule ^ - [R=404,END]
 <LocationMatch "^/v1/">
  <LimitExcept POST>
   Require all denied
  </LimitExcept>
 </LocationMatch>
 <LocationMatch "^/sdk/">
  <LimitExcept GET HEAD>
   Require all denied
  </LimitExcept>
  Header set Cache-Control "public, max-age=300"
 </LocationMatch>
 Header always set X-Content-Type-Options "nosniff"
 Header always set Referrer-Policy "no-referrer"
 Header always set Strict-Transport-Security "max-age=31536000"
 Header always unset X-Powered-By
 Include /etc/letsencrypt/options-ssl-apache.conf
 SSLCertificateFile /etc/letsencrypt/live/ads.roadrunners.run/fullchain.pem
 SSLCertificateKeyFile /etc/letsencrypt/live/ads.roadrunners.run/privkey.pem
</VirtualHost>
</IfModule>
